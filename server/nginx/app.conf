# /etc/nginx/sites-available/app.conf — reverse proxy до Gitea
# Користувач бачить лише http://app.student.lab; внутрішній порт 3000 слухає тільки 127.0.0.1.
upstream lab_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name app.student.lab;

    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log warn;

    client_max_body_size 512m;    # push великих репозиторіїв/вкладень

    location / {
        proxy_pass http://lab_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
    }

    # Зрозуміла сторінка, якщо backend недоступний (допомагає діагностиці)
    error_page 502 503 504 /50x.html;
    location = /50x.html { root /var/www/lab-server; ssi on; internal; }
}
