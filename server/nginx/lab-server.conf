# /etc/nginx/sites-available/lab-server.conf — корпоративний web-сервіс
server {
    listen 80 default_server;
    server_name lab-server.student.lab www.student.lab lab-server;

    root  /var/www/lab-server;
    index index.html;
    ssi   on;                 # hostname підставляється на льоту (<!--# echo var="hostname" -->)

    access_log /var/log/nginx/lab-server.access.log;
    error_log  /var/log/nginx/lab-server.error.log warn;

    location / { try_files $uri $uri/ =404; }

    # легкий endpoint для healthcheck/моніторингу
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok $hostname\n";
    }
}
