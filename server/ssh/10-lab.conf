# /etc/ssh/sshd_config.d/10-lab.conf — керується з ~/infra/server/ssh
# Файли в sshd_config.d читаються першими, а для sshd діє ПЕРШЕ знайдене значення,
# тому префікс 10- гарантує пріоритет над будь-якими 50-*.conf.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no
AllowGroups sshusers
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
