# /etc/dnsmasq.d/student.lab.conf — авторитетна зона student.lab для host-only мережі
# Слухаємо ТІЛЬКИ на enp0s8 (192.168.56.10): не конфліктуємо з systemd-resolved (127.0.0.53)
# і не відповідаємо на NAT-інтерфейсі.
interface=enp0s8
except-interface=lo
bind-dynamic              # підхопить адресу, навіть якщо інтерфейс піднявся пізніше за dnsmasq
no-dhcp-interface=enp0s8  # DHCP не роздаємо (адреси статичні)

# Ми не рекурсивний резолвер: обслуговуємо лише свій домен
no-resolv
no-hosts
local=/student.lab/
domain-needed
bogus-priv

host-record=lab-server.student.lab,lab-server,192.168.56.10
host-record=lab-client.student.lab,lab-client,192.168.56.20
cname=www.student.lab,lab-server.student.lab
cname=app.student.lab,lab-server.student.lab

# логи — у journal: journalctl -u dnsmasq
